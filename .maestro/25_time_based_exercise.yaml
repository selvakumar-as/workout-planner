appId: com.selvakumaras.workoutplanner
---
# Tests adding a time-based exercise (Plank) to a workout.
# Verifies that the exercise config modal shows "Duration per Set (seconds) *" instead of "Reps *"
# for time-based exercises, and that the exercise is saved successfully.
- launchApp
- waitForAnimationToEnd
- tapOn: "Navigate to My Workouts"
- waitForAnimationToEnd
- tapOn: "Create new workout"
- waitForAnimationToEnd
- tapOn: "Workout name"
- inputText: "Core Time Test"
- tapOn: "Save workout"
- waitForAnimationToEnd
- tapOn: "Open workout Core Time Test"
- waitForAnimationToEnd
- tapOn: "Add exercise to workout"
- waitForAnimationToEnd
# F2: time-based exercises (Plank) are now in the CORE group
- tapOn: "Filter exercises by Core"
- waitForAnimationToEnd
- tapOn: "Select exercise Plank"
- waitForAnimationToEnd
# F3: tapping an exercise opens a slide-up modal
# Time-based exercise should show Duration per Set field instead of Reps
- assertVisible: "Duration per Set (seconds) *"
# Enter Sets count
- tapOn:
    point: "50%,55%"
- inputText: "3"
- tapOn: "Configure"
# Enter Duration per set (seconds)
- tapOn:
    point: "50%,65%"
- inputText: "30"
- tapOn: "Configure"
- waitForAnimationToEnd
# Save the exercise via the modal button
- tapOn: "Add to Workout"
- waitForAnimationToEnd
# Verify the exercise was added
- assertVisible: "Edit exercise Plank"
